name: worker tick
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:
concurrency:
  group: worker-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Tick the worker
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: |
          if [ -z "$WORKER_TOKEN" ]; then
            echo "::error::WORKER_TOKEN secret is missing"; exit 1
          fi
          code=$(curl -sS -o reply.json -w '%{http_code}' --max-time 290 -X POST \
            -H "Authorization: Bearer $WORKER_TOKEN" \
            "https://istishraf-future.vercel.app/api/worker/tick?budget=280")
          echo "HTTP $code"
          cat reply.json; echo
          [ "$code" = "200" ] || { echo "::error::tick refused with HTTP $code"; exit 1; }
