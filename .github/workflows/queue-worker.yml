# عامل المهام الطويلة على GitHub Actions — بديل مجاني لمستضيف دائم.
#
# كل تشغيل يسحب المهام الجاهزة من طابور Neon حتى تفرغ أو ينتهي السقف الزمني،
# ثم يخرج. لا يحتاج أي خادم إضافي، لكن زمن بدء المهمة يصل إلى ~5 دقائق
# (أقل مدة يدعمها جدول Actions).
#
# الأسرار المطلوبة في المستودع (Settings → Secrets and variables → Actions):
#   DATABASE_URL      اتصال Neon (نفس قيمة تطبيق Vercel)
#   LLM_API_KEY       مفتاح مزوّد النموذج
#   LLM_BASE_URL      عنوان المزود المتوافق مع OpenAI
#   LLM_MODEL_NAME    اسم النموذج
#   ZEP_API_KEY       (اختياري) عند استخدام Zep Cloud

name: queue-worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      max_seconds:
        description: "سقف زمني بالثواني"
        default: "280"

concurrency:
  group: queue-worker
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: تثبيت الاعتماديات
        run: |
          python -m pip install --upgrade pip
          # قائمة اعتماديات العامل فقط (بلا PyTorch/camel) — أسرع بكثير
          pip install -r backend/requirements-worker.txt

      - name: سحب المهام وتنفيذها
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL_NAME: ${{ secrets.LLM_MODEL_NAME }}
          ZEP_API_KEY: ${{ secrets.ZEP_API_KEY }}
          ISTISHRAF_UPLOAD_DIR: ${{ runner.temp }}/uploads
          PYTHONPATH: .
          APP_URL: https://istishraf-future.vercel.app
        run: |
          BUDGET="${{ github.event.inputs.max_seconds || '280' }}"
          # جدول GitHub غير موثوق (تأخّر ساعات اليوم)، فإن خرج التشغيل ومهام ما زالت
          # في الطابور توقّف كل شيء حتى نبضة الجدول التالية. لذلك نُكمل العمل داخل
          # نفس التشغيل حتى تفرغ الطابور أو تقترب نهاية مهلة الوظيفة (12 دقيقة).
          for i in 1 2 3; do
            python -m app.worker --drain --max-seconds "$BUDGET" || true
            PENDING=$(curl -fsS -m 20 "$APP_URL/health" \
              | python -c "import sys,json;print(json.load(sys.stdin)['queue']['pending'])" \
              2>/dev/null || echo 0)
            echo "الدورة $i — مهام متبقية في الطابور: $PENDING"
            if [ "$PENDING" = "0" ]; then break; fi
          done

      - name: إعادة إيقاظ العامل إن بقيت مهام
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: https://istishraf-future.vercel.app
        run: |
          PENDING=$(curl -fsS -m 20 "$APP_URL/health" \
            | python -c "import sys,json;print(json.load(sys.stdin)['queue']['pending'])" \
            2>/dev/null || echo 0)
          echo "مهام متبقية: $PENDING"
          if [ "$PENDING" != "0" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/queue-worker.yml/dispatches" \
              -d '{"ref":"main","inputs":{"max_seconds":"280"}}'
            echo "أُرسلت نبضة إضافية للعامل"
          fi
