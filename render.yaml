services:
  - type: web
    name: istishraf-app
    runtime: docker
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL_NAME
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: ZEP_API_KEY
        sync: false
    disk:
      name: istishraf-uploads
      mountPath: /app/backend/uploads
      sizeGB: 5

  # العامل المستقل: ينفّذ مهام بناء الشبكة وتوليد التقارير من الطابور الدائم.
  # بدون هذا الخدمة تبقى المهام في الطابور ولا تُنفّذ.
  - type: worker
    name: istishraf-worker
    runtime: docker
    plan: starter
    dockerCommand: python -m app.worker
    envVars:
      - key: DATABASE_URL
        fromService:
          type: web
          name: istishraf-app
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: istishraf-app
          envVarKey: SECRET_KEY
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL_NAME
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: ZEP_API_KEY
        sync: false
      - key: ISTISHRAF_JOB_LEASE_SECONDS
        value: "900"
